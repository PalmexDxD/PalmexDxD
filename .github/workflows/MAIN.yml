name: Generate Snake

on:
  schedule:
    - cron: "0 */23 * * *"
  workflow_dispatch:
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout atualizado
      - uses: actions/checkout@v4

      # Geração da snake
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: PalmexDxD
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif

      # Debug
      - run: git status

      # Push atualizado
      name: Generate Snake
      
      on:
        schedule:
          - cron: "0 */6 * * *"
        workflow_dispatch:
      
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
      jobs:
        build:
          runs-on: ubuntu-latest
      
          steps:
            - uses: actions/checkout@v4
      
            - uses: Platane/snk@v3
              with:
                github_user_name: PalmexDxD
                outputs: |
                  dist/github-contribution-grid-snake.svg
                  dist/github-contribution-grid-snake.gif
      
            - name: Commit and push
              run: |
                git config --global user.name "github-actions"
                git config --global user.email "github-actions@github.com"
                git add .
                git commit -m "generate snake" || echo "No changes"
                git push
      
            - uses: crazy-max/ghaction-github-pages@v4
              with:
                target_branch: output
                build_dir: dist
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
